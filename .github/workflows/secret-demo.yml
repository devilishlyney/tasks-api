name: secret-demo
on: workflow_dispatch
jobs:
  about-secret:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
    - run: |
        if [ -z "$DEMO_TOKEN" ]; then
          echo "secret absent"; exit 1
        fi
        echo "longueur : ${#DEMO_TOKEN}"
        echo valeur : $DEMO_TOKEN
        echo variable : $APP_ENV

